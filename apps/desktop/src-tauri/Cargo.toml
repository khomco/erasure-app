[package]
name = "wipestation-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "wipestation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
wipe-common = { path = "../../../crates/wipe-common" }
wipe-engine = { path = "../../../crates/wipe-engine" }
wipe-engine-mock = { path = "../../../crates/wipe-engine-mock" }
wipe-cert = { path = "../../../crates/wipe-cert" }
wipe-fleet = { path = "../../../crates/wipe-fleet" }
wipe-server = { path = "../../../crates/wipe-server" }
tauri = { workspace = true }
tauri-plugin-shell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
async-trait = { workspace = true }
anyhow = { workspace = true }
time = { workspace = true }
url = { workspace = true }

[features]
custom-protocol = ["tauri/custom-protocol"]
