[workspace]
resolver = "2"
members = [
    "crates/wipe-common",
    "crates/wipe-engine",
    "crates/wipe-engine-mock",
    "crates/wipe-cert",
    "crates/wipe-license",
    "crates/wipe-fleet",
    "crates/wipe-server",
    "crates/wipe-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
authors = ["Wipestation Project"]

[workspace.dependencies]
# async
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# errors / logging
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# crypto / hashing
ed25519-dalek = { version = "2", features = ["rand_core", "pem"] }
sha2 = "0.10"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
base64 = "0.22"
hex = "0.4"

# time
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }

# ids
uuid = { version = "1", features = ["v4", "serde"] }

# http
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
hyper = { version = "1", features = ["full"] }

# mdns
mdns-sd = "0.11"

# storage
rusqlite = { version = "0.32", features = ["bundled"] }

# cli
clap = { version = "4", features = ["derive", "env"] }

# misc
once_cell = "1"
parking_lot = "0.12"
url = "2"

# tauri
tauri = { version = "2", features = [] }
tauri-build = "2"
tauri-plugin-shell = "2"

# dev
tokio-test = "0.4"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
