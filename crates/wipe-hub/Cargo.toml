[package]
name = "wipe-hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vendor-side hub: accounts, payments and licence delivery (ADR-0007)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "wipe-hub"
path = "src/main.rs"

# ADR-0007 §1: the only sibling crates allowed here are wipe-common, wipe-cert
# and wipe-license, and no station crate may depend on wipe-hub
# (enforced by tests/deps.rs).
[dependencies]
wipe-common = { path = "../wipe-common" }
wipe-cert = { path = "../wipe-cert" }
wipe-license = { path = "../wipe-license" }
axum = { workspace = true }
tower-http = { workspace = true }
tokio = { workspace = true }
sqlx = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
# Already in the graph through sqlx; signs and verifies Fake payment events.
hmac = "0.12"
base64 = { workspace = true }
uuid = { workspace = true }
# The Stripe provider's API calls (offerings-and-payments story 3).
reqwest = { workspace = true }
# argon2 0.6 needs a newer Rust than the 1.80 MSRV.
argon2 = "0.5"
# 0.11.19 is the last lettre release with rust-version <= 1.80. Plain SMTP
# only: STARTTLS/auth for a production relay is a deployment decision.
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1", "hostname"] }

[dev-dependencies]
tempfile = { workspace = true }
# In-process requests with a chosen peer address (IPv6 throttle test).
tower = { workspace = true }
